<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arsenal 3D</title>
<style>
:root{--bg:#10151b;--fg:#f4f1ea;--ac:#ffb400;--bad:#e5484d}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Impact,"Arial Narrow",system-ui,sans-serif;overflow:hidden;user-select:none}
canvas{display:block}
.h{position:fixed;pointer-events:none;text-shadow:0 2px 4px #000}
#cross{left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:9px;top:0;width:2px;height:20px}#cross:after{top:9px;left:0;height:2px;width:20px}
#hm{left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;opacity:0}
#vig{inset:0;box-shadow:inset 0 0 160px 40px var(--bad);opacity:0}
#hpw{left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:240px;height:18px;background:#0008;border:2px solid #fff}
#hpb{height:100%;width:100%;background:#4ade80}
#wn{right:24px;bottom:calc(52px + env(safe-area-inset-bottom,0px));font-size:30px}
#wn small{font-size:16px;opacity:.7}
#am{right:24px;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:28px;color:var(--ac)}
#bd{right:16px;top:calc(14px + env(safe-area-inset-top,0px));font-size:15px;min-width:170px;background:#0007;padding:8px 10px}
#bd div{display:flex;justify-content:space-between;gap:12px}
#bd .me{color:var(--ac)}
#fd{left:16px;top:calc(14px + env(safe-area-inset-top,0px));font-size:15px}
#ov{position:fixed;inset:0;background:#10151bd9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:20px}
#ov h1{font-size:clamp(44px,9vw,96px);margin:0;color:var(--ac);letter-spacing:2px}
#ov p{max-width:520px;font-family:system-ui,sans-serif;line-height:1.5;margin:8px 0}
#ov b{color:var(--ac)}
</style></head><body>
<div id="hud">
<div class="h" id="cross"></div><div class="h" id="hm">✕</div><div class="h" id="vig"></div>
<div class="h" id="hpw"><div id="hpb"></div></div>
<div class="h" id="wn"></div><div class="h" id="am"></div>
<div class="h" id="bd"></div><div class="h" id="fd"></div>
</div>
<div id="ov"><h1 id="ot">ARSENAL 3D</h1>
<p id="os">Chaque kill te donne l'arme suivante. Le premier à tuer avec le <b>couteau doré</b> gagne.</p>
<p><b>ZQSD</b> bouger · <b>Souris</b> viser · <b>Clic gauche</b> tirer · <b>Clic droit</b> zoom · <b>Espace</b> sauter · <b>R</b> recharger</p>
<p id="oc"><b>Clique pour jouer</b></p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V3=THREE.Vector3,$=id=>document.getElementById(id);
const W=[
{n:'Pistolet',d:22,r:.28,m:12,rl:1.2,s:.012,p:1,a:0,c:0x8a8f96,l:.35},
{n:'SMG',d:13,r:.075,m:30,rl:1.4,s:.03,p:1,a:1,c:0x445566,l:.5},
{n:'Fusil à pompe',d:11,r:.85,m:6,rl:2,s:.07,p:8,a:0,c:0x7a4a22,l:.7},
{n:'AK-47',d:22,r:.1,m:30,rl:1.8,s:.02,p:1,a:1,c:0x5a3a1a,l:.9},
{n:'Desert Eagle',d:50,r:.4,m:7,rl:1.6,s:.006,p:1,a:0,c:0xcfd2d6,l:.45},
{n:'Sniper',d:95,r:1.1,m:5,rl:2.2,s:0,p:1,a:0,c:0x24332a,l:1.2},
{n:'Couteau doré',d:100,r:.45,m:0,rl:0,s:0,p:1,a:1,c:0xffc933,l:.5,k:1}];
// scène
const sc=new THREE.Scene();sc.background=new THREE.Color(0x8ec5ee);sc.fog=new THREE.Fog(0x8ec5ee,30,95);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,200);cam.rotation.order='YXZ';sc.add(cam);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(ren.domElement);
sc.add(new THREE.HemisphereLight(0xffffff,0x556677,.95));
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(20,40,10);sc.add(sun);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
const cv=document.createElement('canvas');cv.width=cv.height=64;const g2=cv.getContext('2d');
g2.fillStyle='#6b7a86';g2.fillRect(0,0,64,64);g2.fillStyle='#5d6b76';g2.fillRect(0,0,32,32);g2.fillRect(32,32,32,32);
const tx=new THREE.CanvasTexture(cv);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(30,30);tx.magFilter=THREE.NearestFilter;
const fl=new THREE.Mesh(new THREE.PlaneGeometry(62,62),new THREE.MeshLambertMaterial({map:tx}));fl.rotation.x=-Math.PI/2;sc.add(fl);
// obstacles
const obs=[];
function addBox(x,z,sx,sz,h,col){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,h,sz),new THREE.MeshLambertMaterial({color:col}));m.position.set(x,h/2,z);sc.add(m);obs.push({a:x-sx/2,b:x+sx/2,h,c:z-sz/2,d:z+sz/2})}
addBox(0,-30.5,62,1,6,0x39424b);addBox(0,30.5,62,1,6,0x39424b);addBox(-30.5,0,1,62,6,0x39424b);addBox(30.5,0,1,62,6,0x39424b);
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<20;i++){const x=(rnd()-.5)*52,z=(rnd()-.5)*52;if(Math.hypot(x,z)<4)continue;
 addBox(x,z,2+rnd()*4,2+rnd()*4,[1.2,2.5,4][i%3],[0xa0522d,0x4a6d8c,0x7a8c4a][i%3])}
addBox(0,0,5,5,2.5,0xc2a24a);
function rayBox(o,d,b){let t0=0,t1=1e9;
 for(const q of [[o.x,d.x,b.a,b.b],[o.y,d.y,0,b.h],[o.z,d.z,b.c,b.d]]){
  if(Math.abs(q[1])<1e-9){if(q[0]<q[2]||q[0]>q[3])return 1e9}
  else{let a=(q[2]-q[0])/q[1],c=(q[3]-q[0])/q[1];if(a>c){const t=a;a=c;c=t}t0=Math.max(t0,a);t1=Math.min(t1,c);if(t0>t1)return 1e9}}
 return t0}
function raySph(o,d,c,r){const x=c.x-o.x,y=c.y-o.y,z=c.z-o.z,t=x*d.x+y*d.y+z*d.z;if(t<0)return 1e9;const q=x*x+y*y+z*z-t*t;return q>r*r?1e9:t-Math.sqrt(r*r-q)}
// entités
const ents=[],COL=[0xd9534f,0x5b8def,0x44b36b,0xb36bd9,0xe0a030];
function mk(name,col,isP){const e={name,isP,x:0,y:0,z:0,vy:0,yaw:0,hp:100,lv:0,dead:false,rt:0,cd:0,kills:0,tt:0,sd:1};
 if(!isP){const gr=new THREE.Group(),M=c=>new THREE.MeshLambertMaterial({color:c});
  const b=new THREE.Mesh(new THREE.BoxGeometry(.7,1.1,.4),M(col));b.position.y=.95;
  const l=new THREE.Mesh(new THREE.BoxGeometry(.6,.7,.35),M(0x22262b));l.position.y=.35;
  const h=new THREE.Mesh(new THREE.SphereGeometry(.24,12,8),M(0xf1c9a5));h.position.y=1.8;
  const gn=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,.6),M(0x111111));gn.position.set(.32,1.1,-.4);
  gr.add(b,l,h,gn);sc.add(gr);e.m=gr}
 ents.push(e);return e}
const P=mk('Toi',0xffffff,true);['Alpha','Bravo','Charlie','Delta','Echo'].forEach((n,i)=>mk(n,COL[i]));
const inObs=(x,z,r)=>obs.some(b=>x>b.a-r&&x<b.b+r&&z>b.c-r&&z<b.d+r);
function spawn(e){let x,z,t=0;do{x=(Math.random()-.5)*54;z=(Math.random()-.5)*54;t++}
 while((inObs(x,z,1)||ents.some(o=>o!==e&&!o.dead&&Math.hypot(o.x-x,o.z-z)<12))&&t<80);
 e.x=x;e.z=z;e.y=0;e.vy=0;e.hp=100;e.dead=false;e.tgt=null;e.wp=null;e.cd=.5;if(e.m)e.m.visible=true}
function groundAt(e){let g=0;for(const b of obs)if(e.x>b.a-.3&&e.x<b.b+.3&&e.z>b.c-.3&&e.z<b.d+.3&&e.y>=b.h-.4)g=Math.max(g,b.h);return g}
function move(e,dx,dz){const r=.4;e.x=Math.max(-29.3,Math.min(29.3,e.x+dx));e.z=Math.max(-29.3,Math.min(29.3,e.z+dz));
 for(const b of obs){if(e.y>=b.h-.4)continue;
  if(e.x>b.a-r&&e.x<b.b+r&&e.z>b.c-r&&e.z<b.d+r){
   const l=e.x-(b.a-r),rr=(b.b+r)-e.x,u=e.z-(b.c-r),d=(b.d+r)-e.z,m=Math.min(l,rr,u,d);
   if(m==l)e.x=b.a-r;else if(m==rr)e.x=b.b+r;else if(m==u)e.z=b.c-r;else e.z=b.d+r;e.hit=1}}}
function phys(e,dt){e.vy-=25*dt;e.y+=e.vy*dt;const g=groundAt(e);if(e.y<=g){e.y=g;e.vy=0;e.on=1}else e.on=0}
// audio
let AC;function snd(f,d,v,ty){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(40,t+d);g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(x){}}
// tirs
const trs=[];
function tracer(a,b){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:0xffe9a0}));sc.add(l);trs.push({l,t:.06})}
let vig=0,hitT=0,state='menu',winner=null;
function feed(t){const d=document.createElement('div');d.textContent=t;$('fd').appendChild(d);setTimeout(()=>d.remove(),4000)}
function fire(o,d,w,sh,spread,mult,from){
 for(let i=0;i<w.p;i++){const dir=d.clone();dir.x+=(Math.random()-.5)*2*spread;dir.y+=(Math.random()-.5)*2*spread;dir.z+=(Math.random()-.5)*2*spread;dir.normalize();
  let best=w.k?2.8:200,hit=null,hd=false;
  for(const b of obs){const t=rayBox(o,dir,b);if(t<best)best=t}
  for(const e of ents){if(e===sh||e.dead)continue;
   const th=raySph(o,dir,{x:e.x,y:e.y+1.8,z:e.z},.26);if(th<best){best=th;hit=e;hd=true}
   for(const yy of [.5,1,1.4]){const tb=raySph(o,dir,{x:e.x,y:e.y+yy,z:e.z},.42);if(tb<best){best=tb;hit=e;hd=false}}}
  if(hit)dmg(hit,w.d*mult*(hd?2:1),sh,hd);
  if(!w.k)tracer(from,o.clone().addScaledVector(dir,best))}}
function dmg(v,n,k,head){if(v.dead)return;v.hp-=n;if(v.isP)vig=.7;
 if(k.isP){hitT=.18;$('hm').style.color=head?'#ff3b3b':'#fff'}
 if(v.hp<=0)kill(v,k)}
function kill(v,k){v.dead=true;v.rt=3;if(v.m)v.m.visible=false;feed(k.name+' ▸ '+v.name+(k.isP?'  ('+W[k.lv].n+')':''));
 if(k===v)return;k.kills++;
 if(W[k.lv].k){win(k);return}
 k.lv++;if(k.isP){setWeapon();snd(700,.25,.1,'sine')}}
function win(k){state='over';winner=k;document.exitPointerLock&&document.exitPointerLock();
 $('ot').textContent=k.isP?'VICTOIRE !':k.name+' a gagné';$('os').textContent=k.isP?'Tu as terminé l’Arsenal avec le couteau doré.':'Il a fini l’Arsenal avant toi.';$('oc').innerHTML='<b>Clique pour rejouer</b>';$('ov').style.display='flex'}
// bots
function bot(e,dt){
 e.hp=Math.min(100,e.hp+dt*3);
 if(e.dead){e.rt-=dt;if(e.rt<=0)spawn(e);return}
 const w=W[e.lv];e.cd-=dt;e.tt-=dt;
 if(e.tt<=0||!e.tgt||e.tgt.dead){e.tt=1+Math.random()*1.5;let b=null,bd=1e9;
  for(const o of ents){if(o===e||o.dead)continue;const d=Math.hypot(o.x-e.x,o.z-e.z);if(d<bd&&d<35){bd=d;b=o}}
  if(b&&b!==e.tgt)e.cd=Math.max(e.cd,.35+Math.random()*.4);e.tgt=b}
 let mx=0,mz=0;const t=e.tgt;e.hit=0;
 if(t){const dx=t.x-e.x,dz=t.z-e.z,dist=Math.hypot(dx,dz)||1;
  const o=new V3(e.x,e.y+1.6,e.z),tp=new V3(t.x,t.y+1.2,t.z),d=tp.clone().sub(o),L=d.length();d.normalize();
  let blocked=false;for(const b of obs)if(rayBox(o,d,b)<L){blocked=true;break}
  e.yaw=Math.atan2(-dx,-dz);const pref=w.k?1.2:(w.p>1?7:13);
  if(blocked||dist>pref){mx=dx/dist;mz=dz/dist}else if(dist<pref*.5){mx=-dx/dist;mz=-dz/dist}
  if(!blocked){if(Math.random()<dt*.7)e.sd=-e.sd;mx+=-dz/dist*.8*e.sd;mz+=dx/dist*.8*e.sd}
  if(!blocked&&e.cd<=0&&dist<(w.k?2.5:55)){
   e.cd=w.r*(w.a?1.5:1.3)+Math.random()*.15;
   const f=new V3(-Math.sin(e.yaw),0,-Math.cos(e.yaw));
   fire(o,d,w,e,w.s+.03,.5,o.clone().addScaledVector(f,.6).add(new V3(0,-.4,0)));
   const dp=Math.hypot(P.x-e.x,P.z-e.z);if(dp<35)snd(w.k?300:180+Math.random()*40,.1,.05*(1-dp/35))}
 }else{if(!e.wp||Math.hypot(e.wp.x-e.x,e.wp.z-e.z)<2)e.wp={x:(Math.random()-.5)*54,z:(Math.random()-.5)*54};
  const dx=e.wp.x-e.x,dz=e.wp.z-e.z,dd=Math.hypot(dx,dz)||1;mx=dx/dd;mz=dz/dd;e.yaw=Math.atan2(-dx,-dz)}
 const n=Math.hypot(mx,mz)||1;move(e,mx/n*5.2*dt,mz/n*5.2*dt);
 if(e.hit&&e.on){e.vy=8.5;e.sd=-e.sd;if(!t)e.wp=null}
 phys(e,dt);e.m.position.set(e.x,e.y,e.z);e.m.rotation.y=e.yaw}
// joueur
let vm,kick=0,yaw=0,pitch=0,md=0,zoom=0,latch=0,locked=false;const keys={};
function setWeapon(){const w=W[P.lv];if(vm)cam.remove(vm);vm=new THREE.Group();
 const M=c=>new THREE.MeshLambertMaterial({color:c});
 if(w.k){const bl=new THREE.Mesh(new THREE.BoxGeometry(.035,.07,.5),M(w.c));bl.position.z=-.3;const hd=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.16),M(0x222222));vm.add(bl,hd)}
 else{const b=new THREE.Mesh(new THREE.BoxGeometry(.09,.12,w.l),M(w.c));b.position.z=-w.l/2;
  const gp=new THREE.Mesh(new THREE.BoxGeometry(.07,.2,.08),M(0x222222));gp.position.set(0,-.14,-.05);
  const fl=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),new THREE.MeshBasicMaterial({color:0xffdd55}));fl.position.z=-w.l-.06;fl.visible=false;vm.fl=fl;vm.add(b,gp,fl)}
 vm.position.set(.25,-.22,-.45);cam.add(vm);P.ammo=w.m;P.rl=0}
function playerUpdate(dt){
 const w=W[P.lv];vm.visible=!P.dead;P.hp=Math.min(100,P.hp+dt*3);
 if(P.dead){P.rt-=dt;cam.position.y=Math.max(.4,cam.position.y-dt*2);cam.rotation.z=Math.min(.6,cam.rotation.z+dt);if(P.rt<=0){spawn(P);setWeapon()}return}
 cam.rotation.z=0;
 const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
 let dx=-Math.sin(yaw)*f+Math.cos(yaw)*s,dz=-Math.cos(yaw)*f-Math.sin(yaw)*s;const n=Math.hypot(dx,dz)||1,sp=w.k?8.5:7;
 const mv=f||s;move(P,dx/n*sp*dt*(mv?1:0),dz/n*sp*dt*(mv?1:0));
 if(keys.Space&&P.on)P.vy=8.5;phys(P,dt);
 cam.position.set(P.x,P.y+1.7,P.z);cam.rotation.set(pitch,yaw,0);
 cam.fov+=((zoom?(w.n=='Sniper'?22:50):75)-cam.fov)*Math.min(1,dt*14);cam.updateProjectionMatrix();
 P.cd-=dt;
 if(P.rl>0){P.rl-=dt;if(P.rl<=0)P.ammo=w.m}
 if(md&&P.cd<=0&&P.rl<=0&&(w.a||!latch)&&(w.k||P.ammo>0)){
  latch=1;P.cd=w.r;cam.updateMatrixWorld();
  const d=new V3(0,0,-1).applyQuaternion(cam.quaternion);
  const sp2=w.s*(mv?1.6:1)*(P.on?1:2.5)*(zoom?.3:1);
  fire(cam.position.clone(),d,w,P,sp2,1,cam.localToWorld(new V3(.25,-.2,-.7)));
  if(w.k){kick=.18;snd(250,.12,.08,'sawtooth')}else{P.ammo--;kick=.07;pitch+=.004+w.d*.00004;vm.fl.visible=true;snd(w.p>1?110:200,.12,.1);setTimeout(()=>vm.fl&&(vm.fl.visible=false),50);if(P.ammo<=0)P.rl=w.rl}}
 kick*=Math.pow(.001,dt);vm.position.z=-.45+kick;vm.rotation.x=kick*(w.k?-3:1.5)}
// HUD
const hpb=$('hpb'),am=$('am'),wn=$('wn');let bt=0;
function hud(dt){const w=W[P.lv];hpb.style.width=Math.max(0,P.hp)+'%';hpb.style.background=P.hp<35?'#e5484d':'#4ade80';
 am.textContent=w.k?'∞':(P.rl>0?'Recharge…':P.ammo+' / '+w.m);wn.innerHTML=w.n+' <small>'+(P.lv+1)+'/'+W.length+'</small>';
 hitT-=dt;$('hm').style.opacity=Math.max(0,hitT*5);vig=Math.max(0,vig-dt*1.1);$('vig').style.opacity=vig;
 bt-=dt;if(bt<=0){bt=.3;$('bd').innerHTML=[...ents].sort((a,b)=>b.lv-a.lv||b.kills-a.kills).map(e=>'<div'+(e.isP?' class="me"':'')+'><span>'+e.name+'</span><span>'+(e.lv+1)+' · '+e.kills+'</span></div>').join('')}}
function reset(){ents.forEach(e=>{e.lv=0;e.kills=0;spawn(e);if(e.m){e.m.position.set(e.x,0,e.z)}});setWeapon();state='play';$('fd').innerHTML=''}
// entrées
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='KeyR'&&state=='play'){const w=W[P.lv];if(!w.k&&P.rl<=0&&P.ammo<w.m)P.rl=w.rl}if(e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('mousedown',e=>{if(!locked)return;if(e.button==0)md=1;if(e.button==2)zoom=1});
addEventListener('mouseup',e=>{if(e.button==0){md=0;latch=0}if(e.button==2)zoom=0});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(!locked||state!='play')return;const k=zoom?.0011:.0022;yaw-=e.movementX*k;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*k))});
$('ov').onclick=()=>{if(state!='play')reset();ren.domElement.requestPointerLock()};
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===ren.domElement;
 if(locked)$('ov').style.display='none';else if(state=='play'){$('ot').textContent='PAUSE';$('os').textContent='';$('oc').innerHTML='<b>Clique pour reprendre</b>';$('ov').style.display='flex'}});
// boucle
setWeapon();spawn(P);ents.forEach(e=>{if(!e.isP)spawn(e)});let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 if(locked&&state=='play'){playerUpdate(dt);for(const e of ents)if(!e.isP)bot(e,dt);
  for(let i=trs.length-1;i>=0;i--){trs[i].t-=dt;if(trs[i].t<=0){sc.remove(trs[i].l);trs[i].l.geometry.dispose();trs.splice(i,1)}}}
 else if(state=='menu'){cam.position.set(Math.cos(now/4000)*25,12,Math.sin(now/4000)*25);cam.lookAt(0,0,0);vm.visible=false;for(const e of ents)if(e.m){e.m.position.set(e.x,e.y,e.z)}}
 hud(dt);ren.render(sc,cam)}
requestAnimationFrame(loop);
</script></body></html>
